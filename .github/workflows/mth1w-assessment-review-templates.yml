name: MTH1W Assessment Review Templates

on:
  pull_request:
    paths:
      - 'curriculum/content/mth1w/**'
      - 'curriculum/courses/ontario-mth1w-2021.assessment-plan.json'
      - 'tools/mth1w_assessment_review_evidence.py'
      - 'tools/mth1w_assessment_review_templates.py'
      - 'tests/test_mth1w_assessment_review_templates.py'
      - '.github/workflows/mth1w-assessment-review-templates.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-assessment-review-templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Verify template determinism and non-evidence boundary
        run: |
          python tools/mth1w_assessment_review_templates.py verify
          python -m unittest tests.test_mth1w_assessment_review_templates -v

      - name: Build exact current assessment review templates
        run: |
          rm -rf /tmp/mth1w-assessment-review-templates
          python tools/mth1w_assessment_review_templates.py build \
            --output /tmp/mth1w-assessment-review-templates
          test -f /tmp/mth1w-assessment-review-templates/manifest.json

      - name: Upload short-lived template package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: mth1w-assessment-review-templates-${{ github.sha }}
          path: /tmp/mth1w-assessment-review-templates
          if-no-files-found: error
          retention-days: 7
