name: Repository branch hygiene

on:
  pull_request:
    paths:
      - tools/repository_branch_cleanup.py
      - tests/test_repository_branch_cleanup.py
      - .github/workflows/branch-hygiene.yml
  workflow_dispatch:

permissions: {}

concurrency:
  group: repository-branch-hygiene
  cancel-in-progress: false

jobs:
  audit:
    if: github.event_name == 'pull_request'
    name: Audit branch cleanup tooling
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compile branch cleanup tool
        run: python -m py_compile tools/repository_branch_cleanup.py tests/test_repository_branch_cleanup.py

      - name: Run branch cleanup tests
        run: python -m unittest tests/test_repository_branch_cleanup.py -v

      - name: Verify command surface
        run: python tools/repository_branch_cleanup.py --help

  cleanup:
    if: github.event_name == 'workflow_dispatch'
    name: Archive unique refs and delete stale branches
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Check out canonical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Close stale Dependabot review queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          api = 'https://api.github.com'
          repository = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'Content-Type': 'application/json',
              'User-Agent': 'axiom-education-branch-hygiene',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(method, path, payload=None):
              data = None
              if payload is not None:
                  data = json.dumps(payload, separators=(',', ':')).encode('utf-8')
              req = urllib.request.Request(
                  f'{api}{path}', data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
              return json.loads(raw) if raw else None

          pulls = request('GET', f'/repos/{repository}/pulls?state=open&per_page=100')
          if not isinstance(pulls, list):
              raise SystemExit('GitHub open-pull-request response was not an array')

          closed = []
          for pull in pulls:
              user = pull.get('user') or {}
              head = pull.get('head') or {}
              head_repo = head.get('repo') or {}
              base = pull.get('base') or {}
              head_ref = head.get('ref')
              if not (
                  user.get('login') == 'dependabot[bot]'
                  and isinstance(head_ref, str)
                  and head_ref.startswith('dependabot/')
                  and head_repo.get('full_name') == repository
                  and base.get('ref') == 'main'
              ):
                  continue

              number = int(pull['number'])
              comment = (
                  'Closed as part of an explicitly dispatched repository branch-hygiene run. '
                  'This dependency update is being superseded by a controlled '
                  'dependency-upgrade tranche. Its exact head commit will be preserved '
                  'under the run-scoped archival-tag namespace before the branch ref is deleted.'
              )
              request(
                  'POST',
                  f'/repos/{repository}/issues/{number}/comments',
                  {'body': comment},
              )
              request(
                  'PATCH',
                  f'/repos/{repository}/pulls/{number}',
                  {'state': 'closed'},
              )
              closed.append(
                  {
                      'number': number,
                      'title': pull.get('title'),
                      'head': head_ref,
                      'sha': head.get('sha'),
                      'disposition': 'closed; head preserved as archival tag before branch deletion',
                  }
              )

          Path('/tmp/closed-dependabot-pulls.json').write_text(
              json.dumps(closed, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(f'closed verified Dependabot pull requests: {len(closed)}')
          PY

      - name: Clean repository branches fail closed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python tools/repository_branch_cleanup.py
          --repository "$GITHUB_REPOSITORY"
          --default-branch main
          --archive-prefix "archive/branches/manual-${GITHUB_RUN_ID}"
          --apply
          --report /tmp/axiom-education-branch-cleanup.json

      - name: Publish durable cleanup evidence
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_TITLE: Repository branch cleanup evidence — run ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report_path = Path('/tmp/axiom-education-branch-cleanup.json')
          report = json.loads(report_path.read_text(encoding='utf-8'))
          closed_path = Path('/tmp/closed-dependabot-pulls.json')
          report['closed_dependabot_pull_requests'] = (
              json.loads(closed_path.read_text(encoding='utf-8'))
              if closed_path.exists()
              else []
          )
          report_path.write_text(
              json.dumps(report, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          body = (
              '# Repository branch cleanup evidence\n\n'
              'This issue is maintained by the explicitly dispatched branch-hygiene workflow. '
              'It records the exact post-cleanup branch state and the reversible '
              'disposition of removed branch refs.\n\n'
              '```json\n'
              + json.dumps(report, indent=2, sort_keys=True)
              + '\n```\n'
          )
          Path('/tmp/axiom-education-branch-cleanup-issue.md').write_text(
              body, encoding='utf-8'
          )
          PY

          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state all \
              --search "${EVIDENCE_TITLE} in:title" \
              --json number,title \
              --jq '.[] | select(.title == env.EVIDENCE_TITLE) | .number' \
              | head -n 1
          )"

          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file /tmp/axiom-education-branch-cleanup-issue.md
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$EVIDENCE_TITLE" \
              --body-file /tmp/axiom-education-branch-cleanup-issue.md
          fi

      - name: Upload cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: axiom-education-branch-cleanup
          path: |
            /tmp/axiom-education-branch-cleanup.json
            /tmp/closed-dependabot-pulls.json
          if-no-files-found: warn
          retention-days: 90
