name: Ontario Elementary Direct Source Capture

on:
  pull_request:
    branches:
      - main
      - feature/curriculum-standard-record-v2-20260811
    paths:
      - 'curriculum/ontario-elementary/direct-government-capture-targets.v1.json'
      - 'tools/direct_government_curriculum_capture.py'
      - 'tools/check_curriculum_source_lock_drift.py'
      - 'tests/test_direct_government_curriculum_capture.py'
      - '.github/workflows/ontario-elementary-direct-source-capture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-arts-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate exact-route policy
        run: |
          python tools/direct_government_curriculum_capture.py validate-targets
          python -m unittest tests.test_direct_government_curriculum_capture -v

      - name: Capture exact current Arts route
        run: |
          mkdir -p /tmp/axiom-direct-source
          python tools/direct_government_curriculum_capture.py capture \
            --source-id ontario-arts-grades-1-8-2009 \
            --output /tmp/axiom-direct-source/source-lock-candidate.json
          python tools/curriculum_source_lock.py verify \
            /tmp/axiom-direct-source/source-lock-candidate.json

      - name: Compare with committed evidence when present
        run: |
          python tools/check_curriculum_source_lock_drift.py \
            /tmp/axiom-direct-source/source-lock-candidate.json \
            --allow-uncommitted

      - name: Upload metadata-only C1 candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ontario-elementary-source-lock-ontario-arts-grades-1-8-2009-${{ github.sha }}
          path: /tmp/axiom-direct-source/source-lock-candidate.json
          if-no-files-found: error
          retention-days: 7
