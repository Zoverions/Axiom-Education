name: Ontario Elementary Licensing Review Evidence

on:
  pull_request:
    branches:
      - main
      - feature/ontario-elementary-readiness-monitoring-20260811
    paths:
      - 'requirements-dev.txt'
      - 'curriculum/ontario-elementary/source-discovery.v0.json'
      - 'curriculum/ontario-elementary/source-discovery-amendments.v1.json'
      - 'curriculum/ontario-elementary/source-discovery-additions.v1.json'
      - 'curriculum/ontario-elementary/source-discovery-addition-amendments.v1.json'
      - 'curriculum/ontario-elementary/source-locks/**'
      - 'curriculum/licensing/ontario-elementary/reviews/**'
      - 'tools/curriculum_source_lock.py'
      - 'tools/ontario_elementary_source_review.py'
      - 'tools/ontario_elementary_licensing_review.py'
      - 'tests/test_ontario_elementary_licensing_review.py'
      - '.github/workflows/ontario-elementary-licensing-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-licensing-review-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Python verification dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify licensing review tooling and current evidence
        run: |
          python -m unittest tests.test_ontario_elementary_licensing_review -v
          python tools/ontario_elementary_licensing_review.py verify-directory
      - name: Prove deterministic licensing target plan
        run: |
          mkdir -p /tmp/axiom-elementary-licensing-review
          python tools/ontario_elementary_licensing_review.py plan \
            --output /tmp/axiom-elementary-licensing-review/plan-a.json
          python tools/ontario_elementary_licensing_review.py plan \
            --output /tmp/axiom-elementary-licensing-review/plan-b.json
          cmp /tmp/axiom-elementary-licensing-review/plan-a.json /tmp/axiom-elementary-licensing-review/plan-b.json
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.ontario_elementary_licensing_review import verify_directory

          plan = json.loads(Path('/tmp/axiom-elementary-licensing-review/plan-a.json').read_text())
          if plan['target_count'] != 16:
              raise SystemExit(f"expected 16 licensing targets, found {plan['target_count']}")
          summary = verify_directory()
          if summary['targets'] != 16:
              raise SystemExit(f"unexpected licensing target count: {summary}")
          if summary['licensing_review_complete'] and summary['resolved_sources'] != 16:
              raise SystemExit(f"licensing completeness overclaim: {summary}")
          PY
      - name: Upload deterministic licensing review plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ontario-elementary-licensing-review-plan-${{ github.sha }}
          path: /tmp/axiom-elementary-licensing-review/plan-a.json
          if-no-files-found: error
          retention-days: 14
