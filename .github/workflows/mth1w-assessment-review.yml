name: MTH1W Assessment Review Evidence

on:
  pull_request:
    paths:
      - 'curriculum/content/mth1w/**'
      - 'curriculum/courses/ontario-mth1w-2021.assessment-plan.json'
      - 'curriculum/reviews/mth1w-assessment/**'
      - 'config/curriculum-readiness.json'
      - 'schemas/assessment-review-evidence.v1.schema.json'
      - 'tools/mth1w_assessment_review_evidence.py'
      - 'tests/test_mth1w_assessment_review_evidence.py'
      - '.github/workflows/mth1w-assessment-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-assessment-review-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate assessment review schema
        run: python -m json.tool schemas/assessment-review-evidence.v1.schema.json >/dev/null

      - name: Generate exact current assessment review plan
        run: |
          python tools/mth1w_assessment_review_evidence.py plan \
            --output /tmp/mth1w-assessment-review-plan.json
          python -m json.tool /tmp/mth1w-assessment-review-plan.json >/dev/null

      - name: Verify committed assessment review evidence and readiness boundary
        run: |
          python tools/mth1w_assessment_review_evidence.py verify-directory
          python tools/mth1w_assessment_review_evidence.py verify-readiness

      - name: Run assessment review mutation tests
        run: python -m unittest tests.test_mth1w_assessment_review_evidence -v

      - name: Upload short-lived assessment review plan
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: mth1w-assessment-review-plan-${{ github.sha }}
          path: /tmp/mth1w-assessment-review-plan.json
          if-no-files-found: error
          retention-days: 7
