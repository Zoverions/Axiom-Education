name: Axiom Education CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axiom-education-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-registry:
    name: Capability registry
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install exact Python test dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Verify capability, identity, deprecation, and claim parity
        run: python tools/check_capabilities.py

      - name: Verify pinned AXIOM-MESH compatibility and draft boundaries
        run: python tools/check_axiom_mesh_compatibility.py

      - name: Run complete Python test suite
        run: python -m pytest -q

      - name: Verify canonical Axiom Education contract digest
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected = 'a20e191a05308ef85bdc1cc74bfa0d54b98a176818f8030a172b4c3709a28fa2'
          actual = sha256(Path('contracts/axiom-education.v1.json').read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Axiom Education contract digest mismatch: {actual}')
          print(f'Axiom Education contract verified: {actual}')
          PY

  curriculum-pack:
    name: Deterministic signed Ontario curriculum pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Compile curriculum tooling and slice tests
        run: >-
          python -m py_compile
          tools/curriculum_pack.py
          tests/test_curriculum_pack.py
          tests/test_mth1w_slice.py

      - name: Run curriculum pack unit tests
        run: python -m unittest discover -s tests -p 'test_curriculum_pack.py' -v

      - name: Run frozen MTH1W subset tests
        run: python -m unittest discover -s tests -p 'test_mth1w_slice.py' -v

      - name: Build the Ontario curriculum pack twice
        run: |
          rm -rf /tmp/axiom-education-ontario-a /tmp/axiom-education-ontario-b
          python tools/curriculum_pack.py build \
            --input assets/curriculum/ontario_curriculum_full.json \
            --ledger curriculum/source-ledger.v1.json \
            --output /tmp/axiom-education-ontario-a \
            --pack-id ontario-secondary \
            --pack-version 1.0.0
          python tools/curriculum_pack.py build \
            --input assets/curriculum/ontario_curriculum_full.json \
            --ledger curriculum/source-ledger.v1.json \
            --output /tmp/axiom-education-ontario-b \
            --pack-id ontario-secondary \
            --pack-version 1.0.0
          cmp /tmp/axiom-education-ontario-a/manifest.json /tmp/axiom-education-ontario-b/manifest.json
          cmp /tmp/axiom-education-ontario-a/records.jsonl /tmp/axiom-education-ontario-b/records.jsonl
          python tools/curriculum_pack.py verify --pack-dir /tmp/axiom-education-ontario-a

      - name: Sign and verify with an ephemeral Ed25519 key
        run: |
          umask 077
          openssl genpkey -algorithm ED25519 -out /tmp/axiom-education-ontario-private.pem
          openssl pkey \
            -in /tmp/axiom-education-ontario-private.pem \
            -pubout \
            -out /tmp/axiom-education-ontario-public.pem
          python tools/curriculum_pack.py sign \
            --pack-dir /tmp/axiom-education-ontario-a \
            --private-key /tmp/axiom-education-ontario-private.pem \
            --public-key /tmp/axiom-education-ontario-public.pem
          python tools/curriculum_pack.py verify \
            --pack-dir /tmp/axiom-education-ontario-a \
            --public-key /tmp/axiom-education-ontario-public.pem \
            --require-signature
          rm -f /tmp/axiom-education-ontario-private.pem /tmp/axiom-education-ontario-public.pem

  flutter:
    name: Flutter analyze, test, Android build, and clean install
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Run canonical repository verification
        run: python tools/verify.py

      - name: Show Dart formatting diff after verification failure
        if: failure()
        run: |
          dart format lib test
          git diff -- lib test

      - name: Upload formatter-corrected sources after verification failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axiom-education-dart-format-${{ github.sha }}
          path: |
            lib
            test
          if-no-files-found: error
          retention-days: 1

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Verify Android development-preview APK signature
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$sdk_root"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"

      - name: Exercise clean Android install and reinstall recovery
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          package_id=com.zoverions.ontarioedai
          avd_name=axiom-education-api-35
          system_image="system-images;android-35;google_apis;x86_64"
          sdkmanager="$(command -v sdkmanager)"
          avdmanager="$(command -v avdmanager)"
          adb="$(command -v adb)"

          "$sdkmanager" "emulator" "$system_image"
          emulator="$(command -v emulator)"
          test -e /dev/kvm
          sudo chmod 0666 /dev/kvm
          echo no | "$avdmanager" create avd \
            --force \
            --name "$avd_name" \
            --package "$system_image" \
            --device pixel_2

          emulator_log="$RUNNER_TEMP/axiom-education-emulator.log"
          "$emulator" -avd "$avd_name" \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -camera-back none \
            -camera-front none \
            >"$emulator_log" 2>&1 &

          cleanup() {
            "$adb" emu kill >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          "$adb" wait-for-device
          deadline=$((SECONDS + 300))
          while true; do
            booted="$("$adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [[ "$booted" == "1" ]]; then
              break
            fi
            if (( SECONDS >= deadline )); then
              cat "$emulator_log"
              exit 1
            fi
            sleep 5
          done

          device_api="$("$adb" shell getprop ro.build.version.sdk | tr -d '\r')"
          test "$device_api" = "35"

          install_and_launch() {
            local install_log launch_log launcher
            install_log="$(mktemp "$RUNNER_TEMP/axiom-education-install.XXXXXX")"
            launch_log="$(mktemp "$RUNNER_TEMP/axiom-education-launch.XXXXXX")"
            "$adb" install --no-streaming "$apk" | tee "$install_log"
            grep -Fx "Success" "$install_log"
            "$adb" shell pm path "$package_id" | grep -F "package:"
            launcher="$("$adb" shell cmd package resolve-activity \
              --brief \
              -a android.intent.action.MAIN \
              -c android.intent.category.LAUNCHER \
              "$package_id" | tr -d '\r' | tail -n 1)"
            [[ "$launcher" == "$package_id/"* ]]
            "$adb" shell am start -W -n "$launcher" | tee "$launch_log"
            grep -F "Status: ok" "$launch_log"
            sleep 3
            test -n "$("$adb" shell pidof "$package_id" | tr -d '\r')"
          }

          install_and_launch
          "$adb" uninstall "$package_id" | grep -Fx "Success"
          if "$adb" shell pm path "$package_id" | grep -q "^package:"; then
            echo "Package remained installed after uninstall" >&2
            exit 1
          fi
          install_and_launch

      - name: Write exact-head Android development-preview evidence
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          artifact_dir=build/app/outputs/flutter-apk
          (
            cd "$artifact_dir"
            sha256sum app-debug.apk > app-debug.apk.sha256
          )
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          apk = Path("build/app/outputs/flutter-apk/app-debug.apk")
          pubspec = Path("pubspec.yaml").read_text(encoding="utf-8")
          version_match = re.search(r"^version:\s*(\S+)\s*$", pubspec, re.MULTILINE)
          if version_match is None:
              raise SystemExit("pubspec.yaml has no version")

          source_sha = os.environ["SOURCE_SHA"]
          workflow_sha = os.environ["GITHUB_SHA"]
          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              raise SystemExit("SOURCE_SHA is not a full lowercase commit SHA")
          if re.fullmatch(r"[0-9a-f]{40}", workflow_sha) is None:
              raise SystemExit("GITHUB_SHA is not a full lowercase commit SHA")

          evidence = {
              "schema": "axiom.education.android-preview-evidence.v1",
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_sha": source_sha,
              "workflow_sha": workflow_sha,
              "version": version_match.group(1),
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "artifact": {
                  "name": apk.name,
                  "sha256": hashlib.sha256(apk.read_bytes()).hexdigest(),
                  "size_bytes": apk.stat().st_size,
                  "build_profile": "debug",
                  "signature_verification": "apksigner-verified",
                                    "install_verification": (
                      "android-emulator-api-35-clean-install-and-reinstall-passed"
                  ),
                  "upgrade_verification": (
                      "not-run-no-prior-installable-release"
                  ),
              },
              "release_ready": False,
              "claim_boundary": (
                  "Development preview only. This evidence proves an API-35 emulator clean "
                  "install and uninstall/reinstall recovery for these exact APK bytes. It "
                  "does not prove upgrade compatibility, production signing, store readiness, "
                  "physical-device behavior, or release readiness."
              ),
          }

          output = apk.with_name("app-debug.evidence.json")
          output.write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Android development-preview artifact and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: axiom-education-android-debug-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-debug.apk.sha256
            build/app/outputs/flutter-apk/app-debug.evidence.json
          if-no-files-found: error
          retention-days: 30
