name: Axiom Education CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: axiom-education-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-registry:
    name: Capability registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify capability, identity, deprecation, and claim parity
        run: python tools/check_capabilities.py

      - name: Verify canonical Axiom Education contract digest
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected = 'a20e191a05308ef85bdc1cc74bfa0d54b98a176818f8030a172b4c3709a28fa2'
          actual = sha256(Path('contracts/axiom-education.v1.json').read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Axiom Education contract digest mismatch: {actual}')
          print(f'Axiom Education contract verified: {actual}')
          PY

  curriculum-pack:
    name: Deterministic signed Ontario curriculum pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile curriculum tooling and slice tests
        run: >-
          python -m py_compile
          tools/curriculum_pack.py
          tests/test_curriculum_pack.py
          tests/test_mth1w_slice.py

      - name: Run curriculum pack unit tests
        run: python -m unittest discover -s tests -p 'test_curriculum_pack.py' -v

      - name: Run frozen MTH1W subset tests
        run: python -m unittest discover -s tests -p 'test_mth1w_slice.py' -v

      - name: Build the Ontario curriculum pack twice
        run: |
          rm -rf /tmp/axiom-education-ontario-a /tmp/axiom-education-ontario-b
          python tools/curriculum_pack.py build \
            --input assets/curriculum/ontario_curriculum_full.json \
            --ledger curriculum/source-ledger.v1.json \
            --output /tmp/axiom-education-ontario-a \
            --pack-id ontario-secondary \
            --pack-version 1.0.0
          python tools/curriculum_pack.py build \
            --input assets/curriculum/ontario_curriculum_full.json \
            --ledger curriculum/source-ledger.v1.json \
            --output /tmp/axiom-education-ontario-b \
            --pack-id ontario-secondary \
            --pack-version 1.0.0
          cmp /tmp/axiom-education-ontario-a/manifest.json /tmp/axiom-education-ontario-b/manifest.json
          cmp /tmp/axiom-education-ontario-a/records.jsonl /tmp/axiom-education-ontario-b/records.jsonl
          python tools/curriculum_pack.py verify --pack-dir /tmp/axiom-education-ontario-a

      - name: Sign and verify with an ephemeral Ed25519 key
        run: |
          umask 077
          openssl genpkey -algorithm ED25519 -out /tmp/axiom-education-ontario-private.pem
          openssl pkey \
            -in /tmp/axiom-education-ontario-private.pem \
            -pubout \
            -out /tmp/axiom-education-ontario-public.pem
          python tools/curriculum_pack.py sign \
            --pack-dir /tmp/axiom-education-ontario-a \
            --private-key /tmp/axiom-education-ontario-private.pem \
            --public-key /tmp/axiom-education-ontario-public.pem
          python tools/curriculum_pack.py verify \
            --pack-dir /tmp/axiom-education-ontario-a \
            --public-key /tmp/axiom-education-ontario-public.pem \
            --require-signature
          rm -f /tmp/axiom-education-ontario-private.pem /tmp/axiom-education-ontario-public.pem

  flutter:
    name: Flutter analyze, test, and Android smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out trusted branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Install exact Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Format MTH1W phase-one Dart files
        run: |
          dart format \
            lib/core/practice/math_answer_verifier.dart \
            lib/core/practice/math_practice_generator.dart \
            lib/core/practice/mth1w_practice_provider.dart \
            lib/core/practice/practice_item.dart \
            lib/core/practice/rational.dart \
            lib/features/diagnostic/diagnostic_screen.dart \
            lib/features/practice/mth1w_practice_screen.dart \
            test/core/practice/math_answer_verifier_test.dart \
            test/core/practice/math_practice_generator_test.dart \
            test/core/practice/rational_test.dart \
            test/features/practice/mth1w_practice_screen_test.dart

      - name: Commit canonical formatting once
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'feat/mth1w-vertical-slice-phase-1'
        shell: bash
        run: |
          if git diff --quiet -- '*.dart'; then
            echo 'Dart files are already canonical.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.dart'
          git commit -m 'Apply canonical Dart formatting for MTH1W phase 1'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Analyze errors and warnings
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: axiom-education-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
