name: Axiom Education CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: axiom-education-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-registry:
    name: Capability registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify capability, identity, deprecation, and claim parity
        run: python tools/check_capabilities.py

      - name: Verify canonical Axiom Education contract digest
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          expected = 'a20e191a05308ef85bdc1cc74bfa0d54b98a176818f8030a172b4c3709a28fa2'
          actual = sha256(Path('contracts/axiom-education.v1.json').read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit(f'Axiom Education contract digest mismatch: {actual}')
          print(f'Axiom Education contract verified: {actual}')
          PY

  curriculum-pack:
    name: Deterministic signed Ontario curriculum pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile curriculum tooling
        run: python -m py_compile tools/curriculum_pack.py tests/test_curriculum_pack.py

      - name: Run curriculum pack unit tests
        run: python -m unittest discover -s tests -p 'test_curriculum_pack.py' -v

      - name: Build the Ontario curriculum pack twice
        run: |
          rm -rf /tmp/axiom-education-ontario-a /tmp/axiom-education-ontario-b
          python tools/curriculum_pack.py build \
            --input assets/curriculum/ontario_curriculum_full.json \
            --ledger curriculum/source-ledger.v1.json \
            --output /tmp/axiom-education-ontario-a \
            --pack-id ontario-secondary \
            --pack-version 1.0.0
          python tools/curriculum_pack.py build \
            --input assets/curriculum/ontario_curriculum_full.json \
            --ledger curriculum/source-ledger.v1.json \
            --output /tmp/axiom-education-ontario-b \
            --pack-id ontario-secondary \
            --pack-version 1.0.0
          cmp /tmp/axiom-education-ontario-a/manifest.json /tmp/axiom-education-ontario-b/manifest.json
          cmp /tmp/axiom-education-ontario-a/records.jsonl /tmp/axiom-education-ontario-b/records.jsonl
          python tools/curriculum_pack.py verify --pack-dir /tmp/axiom-education-ontario-a

      - name: Sign and verify with an ephemeral Ed25519 key
        run: |
          umask 077
          openssl genpkey -algorithm ED25519 -out /tmp/axiom-education-ontario-private.pem
          openssl pkey \
            -in /tmp/axiom-education-ontario-private.pem \
            -pubout \
            -out /tmp/axiom-education-ontario-public.pem
          python tools/curriculum_pack.py sign \
            --pack-dir /tmp/axiom-education-ontario-a \
            --private-key /tmp/axiom-education-ontario-private.pem \
            --public-key /tmp/axiom-education-ontario-public.pem
          python tools/curriculum_pack.py verify \
            --pack-dir /tmp/axiom-education-ontario-a \
            --public-key /tmp/axiom-education-ontario-public.pem \
            --require-signature
          rm -f /tmp/axiom-education-ontario-private.pem /tmp/axiom-education-ontario-public.pem

  flutter:
    name: Flutter analyze, test, and Android smoke build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Check out trusted branch head
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Install exact Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Apply analyzer fixes once
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'fix/runnable-curriculum-browser'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              content = path.read_text(encoding='utf-8')
              if old in content:
                  path.write_text(content.replace(old, new), encoding='utf-8')
                  return
              if new in content:
                  return
              raise SystemExit(f'Expected analyzer-fix anchor missing: {path_text}')

          replace(
              'lib/main.dart',
              '    return const Scaffold(\n      body: Center(\n        child: Semantics(',
              '    return Scaffold(\n      body: Center(\n        child: Semantics(',
          )
          replace(
              'lib/features/diagnostic/diagnostic_screen.dart',
              '    return const Center(\n      child: Semantics(',
              '    return Center(\n      child: Semantics(',
          )
          replace(
              'test/widget_test.dart',
              "import 'package:flutter_riverpod/flutter_riverpod.dart';",
              "import 'package:flutter/material.dart';\nimport 'package:flutter_riverpod/flutter_riverpod.dart';",
          )
          replace(
              'lib/core/services/curriculum_loader.dart',
              "import 'package:sqflite/sqflite.dart';\n",
              '',
          )
          replace(
              'test/benchmark_official_url_test.dart',
              "import 'package:ontarioedai/core/providers/curriculum_provider.dart';\n",
              '',
          )
          replace(
              'lib/features/learning/adaptive_lesson_screen.dart',
              '  double _reflectionPressure = 0.0;\n',
              '',
          )
          replace(
              'lib/features/learning/adaptive_lesson_screen.dart',
              '          onScore: (p, c) {\n            _reflectionPressure = p;\n            _reflectionConsistency = c;\n          },',
              '          onScore: (_, consistency) {\n            _reflectionConsistency = consistency;\n          },',
          )
          PY

      - name: Format changed Dart files
        shell: bash
        run: |
          if [[ -n "${GITHUB_BASE_REF}" ]]; then
            base="origin/${GITHUB_BASE_REF}"
          else
            base='HEAD^'
          fi
          mapfile -t dart_files < <(
            git diff --name-only --diff-filter=ACMRT "${base}...HEAD" -- '*.dart'
          )
          mapfile -t working_tree_dart < <(
            git diff --name-only --diff-filter=ACMRT -- '*.dart'
          )
          declare -A seen=()
          files=()
          for path in "${dart_files[@]}" "${working_tree_dart[@]}"; do
            [[ -n "${path}" && -z "${seen[${path}]+x}" ]] || continue
            seen[${path}]=1
            files+=("${path}")
          done
          if ((${#files[@]})); then
            dart format "${files[@]}"
          fi

      - name: Commit analyzer fixes once
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.head_ref == 'fix/runnable-curriculum-browser'
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Analyzer fixes are already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.dart'
          git commit -m 'Fix runnable-path analyzer findings'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Analyze errors and warnings
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: axiom-education-android-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
