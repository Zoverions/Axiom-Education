name: OntarioEdAI rebuild

on:
  pull_request:
  push:
    branches:
      - rebuild/**
      - main

permissions:
  contents: read

concurrency:
  group: ontarioedai-rebuild-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capability-registry:
    name: Capability registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify capability and claim parity
        run: python tools/check_capabilities.py

  flutter:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.4'
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Install exact Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded
