name: Ontario Elementary Reviewer Dossier

on:
  pull_request:
    branches:
      - main
      - feature/ontario-elementary-readiness-monitoring-20260811
    paths:
      - 'requirements-dev.txt'
      - 'curriculum/ontario-elementary/source-discovery.v0.json'
      - 'curriculum/ontario-elementary/source-discovery-amendments.v1.json'
      - 'curriculum/ontario-elementary/source-discovery-additions.v1.json'
      - 'curriculum/ontario-elementary/source-discovery-addition-amendments.v1.json'
      - 'curriculum/ontario-elementary/source-capture-targets.v1.json'
      - 'curriculum/ontario-elementary/source-monitoring.v1.json'
      - 'curriculum/ontario-elementary/source-locks/**'
      - 'curriculum/reviews/ontario-elementary/sources/**'
      - 'curriculum/licensing/ontario-elementary/reviews/**'
      - 'tools/curriculum_source_lock.py'
      - 'tools/remote_curriculum_source_capture.py'
      - 'tools/check_curriculum_source_monitoring.py'
      - 'tools/ontario_elementary_readiness.py'
      - 'tools/ontario_elementary_source_review.py'
      - 'tools/ontario_elementary_licensing_review.py'
      - 'tools/ontario_elementary_reviewer_dossier.py'
      - 'tests/test_ontario_elementary_source_review.py'
      - 'tests/test_ontario_elementary_licensing_review.py'
      - 'tests/test_ontario_elementary_readiness.py'
      - 'tests/test_ontario_elementary_reviewer_dossier.py'
      - '.github/workflows/ontario-elementary-reviewer-dossier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reviewer-dossier:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned Python verification dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Verify source review, licensing review, readiness, and dossier tooling
        run: |
          python -m unittest tests.test_ontario_elementary_source_review -v
          python -m unittest tests.test_ontario_elementary_licensing_review -v
          python -m unittest tests.test_ontario_elementary_readiness -v
          python -m unittest tests.test_ontario_elementary_reviewer_dossier -v
          python tools/ontario_elementary_source_review.py verify-directory
          python tools/ontario_elementary_licensing_review.py verify-directory
          python tools/ontario_elementary_readiness.py verify
          python tools/ontario_elementary_reviewer_dossier.py verify
      - name: Build reviewer dossier artifact
        run: |
          rm -rf /tmp/axiom-elementary-reviewer-dossier
          python tools/ontario_elementary_reviewer_dossier.py build \
            --output /tmp/axiom-elementary-reviewer-dossier
          python -m json.tool /tmp/axiom-elementary-reviewer-dossier/manifest.json >/dev/null
      - name: Upload reviewer dossier
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: ontario-elementary-reviewer-dossier-${{ github.sha }}
          path: /tmp/axiom-elementary-reviewer-dossier
          if-no-files-found: error
          retention-days: 14
