name: Axiom Education Windows

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "19 6 * * 1"

permissions:
  contents: read

concurrency:
  group: axiom-education-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-windows:
    name: Flutter format, analyze, and test on Windows
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.1'
          channel: stable
          cache: true

      - name: Report toolchain
        run: flutter --version

      - name: Install exact Dart dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify complete Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze errors and warnings
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded
