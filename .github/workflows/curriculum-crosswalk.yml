name: Curriculum Crosswalk Foundation

on:
  pull_request:
    branches:
      - main
      - feature/curriculum-standard-record-v2-20260811
    paths:
      - 'schemas/curriculum-crosswalk.v1.schema.json'
      - 'tools/curriculum_crosswalk.py'
      - 'tests/test_curriculum_crosswalk.py'
      - 'docs/rebuild/CURRICULUM-CROSSWALKS.md'
      - '.github/workflows/curriculum-crosswalk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-crosswalk-foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Validate crosswalk schema
        run: python -m json.tool schemas/curriculum-crosswalk.v1.schema.json >/dev/null

      - name: Run crosswalk mutation and binding tests
        run: python -m unittest tests.test_curriculum_crosswalk -v
