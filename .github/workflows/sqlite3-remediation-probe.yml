name: Vendored SQLite Source Remediation Probe

on:
  pull_request:
    paths:
      - ".github/workflows/sqlite3-remediation-probe.yml"
      - "tools/vendored_sqlite.py"

permissions:
  contents: read

concurrency:
  group: axiom-education-sqlite-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate vendored SQLite on ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: Linux + Android
          - os: windows-2025
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out candidate without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.1"
          channel: stable
          cache: true

      - name: Prepare SHA3-pinned SQLite 3.53.4 source
        run: python tools/vendored_sqlite.py prepare

      - name: Verify SQLite provenance and lock stability
        shell: bash
        run: |
          set -euo pipefail
          python tools/vendored_sqlite.py verify
          git diff --exit-code -- pubspec.lock
          git status --short

      - name: Enforce unchanged Dart dependency lock
        run: flutter pub get --enforce-lockfile

      - name: Analyze source-compiled dependency graph
        run: flutter analyze --no-fatal-infos

      - name: Run complete Flutter tests with source-compiled SQLite
        run: flutter test --reporter expanded

      - name: Build Android debug APK from vendored SQLite
        if: runner.os == 'Linux'
        run: flutter build apk --debug --no-pub

      - name: Build Windows debug application from vendored SQLite
        if: runner.os == 'Windows'
        run: flutter build windows --debug --no-pub

  commit-vendored-source:
    name: Commit verified SQLite source to PR branch
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Reproduce and verify vendored source
        run: |
          python tools/vendored_sqlite.py prepare
          python tools/vendored_sqlite.py verify
          git diff --exit-code -- pubspec.lock

      - name: Commit only verified source/configuration
        shell: bash
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git status --short
          git add pubspec.yaml third_party/sqlite/sqlite3.c third_party/sqlite/PROVENANCE.json third_party/sqlite/README.md
          if git diff --cached --quiet; then
            echo 'No vendored SQLite changes to commit.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'vendor verified SQLite 3.53.4 source for native builds'
          git push origin "HEAD:${HEAD_BRANCH}"
