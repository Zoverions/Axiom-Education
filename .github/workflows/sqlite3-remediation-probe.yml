name: SQLite3 Native Asset Remediation Probe

on:
  pull_request:
    paths:
      - ".github/workflows/sqlite3-remediation-probe.yml"

permissions:
  contents: read

concurrency:
  group: axiom-education-sqlite3-remediation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe sqlite3 3.1.7 under pinned Flutter
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out candidate without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: "3.41.1"
          channel: stable
          cache: true

      - name: Generate transitive sqlite3 3.1.7 lock candidate
        shell: bash
        run: |
          set -euo pipefail
          cp pubspec.yaml "$RUNNER_TEMP/pubspec.before.yaml"
          flutter pub add 'sqlite3:3.1.7'
          cp "$RUNNER_TEMP/pubspec.before.yaml" pubspec.yaml
          flutter pub get
          cmp pubspec.yaml "$RUNNER_TEMP/pubspec.before.yaml"
          python - <<'PY'
          from pathlib import Path
          lock = Path('pubspec.lock').read_text(encoding='utf-8')
          lines = lock.splitlines()
          try:
              start = lines.index('  sqlite3:')
          except ValueError:
              raise SystemExit('sqlite3 lock entry missing')
          end = len(lines)
          for index in range(start + 1, len(lines)):
              line = lines[index]
              if line.startswith('  ') and not line.startswith('    '):
                  end = index
                  break
          entry = '\n'.join(lines[start:end])
          print(entry)
          if 'dependency: transitive' not in entry:
              raise SystemExit('sqlite3 must remain transitive')
          if 'version: "3.1.7"' not in entry:
              raise SystemExit('sqlite3 did not remain pinned to 3.1.7')
          expected = '  flutter: ">=3.41.1 <3.42.0"'
          if expected not in lines:
              raise SystemExit('pinned Flutter lockfile ceiling drifted')
          PY
          mapfile -t changed < <(git diff --name-only)
          printf 'Changed files after normalization:\n'
          printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'pubspec.lock'

      - name: Enforce generated lock
        run: flutter pub get --enforce-lockfile

      - name: Analyze generated dependency graph
        run: flutter analyze --no-fatal-infos

      - name: Test generated dependency graph
        run: flutter test --reporter expanded

      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload generated lock only
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: sqlite3-3.1.7-lock
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 1
