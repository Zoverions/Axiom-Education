name: ontarioedai
description: Axiom Education local-first high-school learning foundations
version: 0.5.0-dev.0
publish_to: none

environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.1 <3.42.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  onnxruntime: ^1.4.0
  tflite_flutter: ^0.11.0
  camera: ^0.11.0
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.0.0
  connectivity_plus: ^6.0.0
  intl: ^0.19.0
  uuid: ^4.5.0
  sqflite: ^2.3.0
  path: ^1.8.3
  sqflite_common_ffi: ^2.4.0+2
  image: ^4.5.4
  crypto: ^3.0.7
  meta: ^1.17.0
  encrypt: ^5.0.3

dev_dependencies:
  fake_async: ^1.3.3
  hive_generator: ^2.0.1
  build_runner: ^2.4.12
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  riverpod_generator: ^2.4.0
  flutter_test:
    sdk: flutter
  msix: ^3.16.0
  flutter_lints: ^6.0.0

flutter:
